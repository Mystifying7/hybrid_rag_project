<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
    <defs>
        <!-- Primary Brand Gradient -->
        <linearGradient id="ragIndigoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>

        <!-- Secondary Emerald Glow Gradient -->
        <linearGradient id="ragEmeraldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>

        <!-- Glass Background Gradient -->
        <linearGradient id="ragGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
        </linearGradient>

        <!-- Outer Ring Gradient -->
        <linearGradient id="ragRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
        </linearGradient>

        <!-- Drop Shadow Filters for Glow Effect -->
        <filter id="ragGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
        </filter>
    </defs>

    <!-- Outer Squircle Container with Soft Shadow -->
    <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ragGlassBg)" stroke="url(#ragRingGrad)" stroke-width="2" filter="url(#subtleShadow)" />

    <!-- Ambient Background Radial Glow -->
    <circle cx="60" cy="60" r="38" fill="url(#ragIndigoCyan)" opacity="0.12" filter="url(#ragGlow)" />

    <!-- Dual-Layer Documentation Pages (Sparse/BM25 Symbolism) -->
    <!-- Back Document Page -->
    <path d="M42 28 H74 C77.3 28 80 30.7 80 34 V70 C80 73.3 77.3 76 74 76 H42 C38.7 76 36 73.3 36 70 V34 C36 30.7 38.7 28 42 28 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Front Document Page with Fold Corner -->
    <path d="M34 36 H64 L76 48 V82 C76 85.3 73.3 88 70 88 H34 C30.7 88 28 85.3 28 82 V42 C28 38.7 30.7 36 34 36 Z" 
          fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <!-- Fold Flap -->
    <path d="M64 36 V48 H76" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    
    <!-- Code / Text Lines on Doc -->
    <line x1="36" y1="52" x2="56" y2="52" stroke="rgba(148, 163, 184, 0.5)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="60" x2="68" y2="60" stroke="rgba(148, 163, 184, 0.35)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="36" y1="68" x2="50" y2="68" stroke="rgba(148, 163, 184, 0.35)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Neural Vector Network Connections (Dense/FAISS + Cross-Encoder Symbolism) -->
    <!-- Vector Connection Lines -->
    <line x1="48" y1="78" x2="68" y2="56" stroke="url(#ragIndigoCyan)" stroke-width="1.8" opacity="0.6" />
    <line x1="68" y1="56" x2="88" y2="72" stroke="url(#ragEmeraldGlow)" stroke-width="1.8" opacity="0.6" />
    <line x1="68" y1="56" x2="68" y2="34" stroke="url(#ragIndigoCyan)" stroke-width="1.8" opacity="0.6" />

    <!-- Vector Nodes -->
    <circle cx="48" cy="78" r="3" fill="#6366f1" />
    <circle cx="68" cy="34" r="3" fill="#38bdf8" />
    <circle cx="88" cy="72" r="3.5" fill="#10b981" />

    <!-- Central High-Precision Search Lens with Glowing Gradients -->
    <!-- Search Circle Lens -->
    <circle cx="68" cy="56" r="22" fill="url(#ragGlassBg)" stroke="url(#ragIndigoCyan)" stroke-width="4" filter="url(#ragGlow)" />

    <!-- Search Inner Prism / Cross-Encoder Focus Core -->
    <circle cx="68" cy="56" r="14" fill="none" stroke="url(#ragEmeraldGlow)" stroke-width="2" stroke-dasharray="6 3" />

    <!-- Central AI Sparkle / Grounding Core -->
    <path d="M68 47 L70.5 53.5 L77 56 L70.5 58.5 L68 65 L65.5 58.5 L59 56 L65.5 53.5 Z" fill="url(#ragIndigoCyan)" />

    <!-- Search Handle / Beam -->
    <line x1="84" y1="72" x2="98" y2="86" stroke="url(#ragIndigoCyan)" stroke-width="5" stroke-linecap="round" filter="url(#ragGlow)" />
    <!-- Handle Accent Tip -->
    <circle cx="98" cy="86" r="2.5" fill="#06b6d4" />

    <!-- Secondary Micro AI Sparks -->
    <path d="M88 34 L89.5 38 L93.5 39.5 L89.5 41 L88 45 L86.5 41 L82.5 39.5 L86.5 38 Z" fill="#38bdf8" opacity="0.9" />
    <circle cx="32" cy="76" r="1.5" fill="#a5b4fc" opacity="0.8" />
</svg>
